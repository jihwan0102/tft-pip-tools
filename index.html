<style>
  /* true-black-flat: elevation by lightness alone, colour only on data
     (the TFT gold), the primary action an inverted white pill. */
  :root {
    --ground: #000000; --surface: #111111; --raised: #2a2a2a; --rule: #1a1a1a;
    --control: #444444; --text: #ffffff; --muted: #b4b4b4; --faint: #949494;
    --accent: #e0b553; --accent-tint: #2a2312;
    --radius-card: 20px; --radius-control: 999px;

  }
  * { box-sizing: border-box; }
  html { background: var(--ground); color-scheme: dark; }
  body { margin: 0; background: var(--ground); color: var(--text); font: 14px/20px var(--font); -webkit-text-size-adjust: 100%; }
  button, select { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; }

  .bar { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 var(--pad); padding-top: env(safe-area-inset-top); box-sizing: content-box; border-bottom: 1px solid var(--rule); }
  .bar h1 { margin: 0; font-size: 18px; line-height: 24px; font-weight: 700; flex: 1; }
  .bar .mark { width: 24px; height: 24px; flex: none; }
  .bar .fresh { color: var(--faint); font-size: 12px; }
  .text { background: none; border: 0; padding: 0 2px; min-height: 44px; color: var(--text); font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--control); }

  main { display: grid; gap: var(--gap); padding: var(--pad); max-width: 1180px; margin: 0 auto; }
  .player { display: grid; gap: var(--gap); align-content: start; }
  .screen { background: var(--surface); border-radius: var(--radius-card); padding: 8px; }
  video { display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 14px; background: var(--ground); }

  .controls { display: grid; grid-template-columns: 52px 1fr 52px; gap: 8px; }
  .controls button { height: 52px; border-radius: var(--radius-control); border: 0; cursor: pointer; }
  .step { background: var(--surface); font-size: 18px; }
  .primary { background: #fff; color: #000; font-weight: 800; font-size: 16px; }
  .step:active, .row:active { background: var(--raised); }
  .primary:active { background: #d9d9d9; }
  .primary:disabled { background: var(--raised); color: var(--muted); }



  .comps { display: grid; gap: var(--gap); align-content: start; }
  .comps h2 { margin: 4px 4px 0; font-size: 16px; line-height: 24px; font-weight: 700; }

  #list { display: grid; background: var(--surface); border-radius: var(--radius-card); padding: 6px; }
  .row { display: grid; grid-template-columns: 32px 1fr auto; align-items: center; gap: 12px; min-height: 60px; padding: 8px 14px 8px 10px; border: 0; border-radius: 14px; background: none; text-align: left; cursor: pointer; }
  .row[aria-current="true"] { background: var(--raised); }
  .tier { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; font-weight: 800; }
  .row .name { display: grid; min-width: 0; }
  .row .name b { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .name small { color: var(--faint); font-size: 12px; line-height: 18px; }
  .row .avg { color: var(--text); font-size: 15px; text-align: right; }
  #list .head { display: flex; justify-content: space-between; padding: 8px 14px 4px 54px; color: var(--faint); font-size: 12px; }
  .state { margin: 0; padding: 16px; color: var(--muted); }
  .skeleton { height: 60px; margin: 2px 0; border-radius: 14px; background: #161616; }

  footer { padding: 8px var(--pad) 32px; max-width: 1180px; margin: 0 auto; color: var(--faint); font-size: 12px; }

  button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

  @media (min-width: 900px) {
    main { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 24px; padding: 24px; }
    .player { position: sticky; top: 24px; }
    .bar, footer { padding-left: 24px; padding-right: 24px; }
  }

<script>
const log = (m) => console.log(m)
window.onerror = (m, src, line) => log(`에러: ${m} (${line})`)
window.onunhandledrejection = (e) => log(`에러: ${e.reason}`)
const MUXER_URL = "https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.mjs"

// Shows MetaTFT ranked comps one at a time on a canvas that is streamed into a
// Picture-in-Picture video, so the guide floats over the game.
const COMPS_URL = "https://api-hc.metatft.com/tft-comps-api/comps_data?queue=1100"
const LOOKUP_URL = (set) => `https://data.metatft.com/lookups/${set}_latest_ko_kr.json`
// Same filters as the default metatft.com/comps view, so order and tiers match.
const BUILDS_URL = (clusterId) => `https://api-hc.metatft.com/tft-comps-api/comp_builds?cluster_id=${clusterId}`
const DETAILS_URL = (comp, clusterId) => `https://api-hc.metatft.com/tft-comps-api/comp_details?comp=${comp}&cluster_id=${clusterId}`
const AUG_TIERLIST_URL = "https://api-hc.metatft.com/tft-stat-api/augments_tiers"
// In-game augment art with rarity colouring, mapped by scripts/update-augment-icons.py.
const AUG_ICONS_URL = "augment-icons.json"
const CDRAGON_ICON = (path) => `https://raw.communitydragon.org/latest/game/${path}.png`
const STATS_URL = (clusterId) => "https://api-hc.metatft.com/tft-comps-api/comps_stats?queue=1100&patch=current&days=3" +
  `&rank=CHALLENGER,DIAMOND,EMERALD,GRANDMASTER,MASTER,PLATINUM&permit_filter_adjustment=true&cluster_id=${clusterId}`
const MIN_PICK_RATE = 0.01
const AUG_COLS = 9, AUG_ROWS = 6
// Augment art is recoloured to its rarity; prismatic gets a rainbow sweep.
const RARITIES = [["Silver", "실버", "#d6dde6"], ["Gold", "골드", "#f7c948"], ["Prismatic", "프리즘", "prism"]]
// One data hue (TFT gold) on true black; everything else is a grey step.
// Mirrors the CSS tokens of the control page.
const C = {
  ground: "#000000", surface: "#111111", raised: "#2a2a2a",
  text: "#ffffff", muted: "#b4b4b4", faint: "#949494",
  accent: "#e0b553", negative: "#e5484d",
}
const ARTIFACT_COLOR = C.accent
// The game's own unit cost colours; players read them at a glance.
const COST_COLORS = { 1: "#8c8c8c", 2: "#11b288", 3: "#207ac7", 4: "#c440da", 5: "#ffb93b" } // taste-skill-ignore: game data encoding
// Tiers by lightness rather than a hue each: gold, white, then two greys.
const TIER_STYLE = {
  S: { bg: "#e0b553", fg: "#000000" },
  A: { bg: "#e6e6e6", fg: "#000000" },
  B: { bg: "#4a4a4a", fg: "#ffffff" },
  C: { bg: "#2a2a2a", fg: "#b4b4b4" },
  D: { bg: "#1a1a1a", fg: "#949494" },
}
const ICON = (kind, name) =>
  `https://cdn.metatft.com/cdn-cgi/image/width=96,height=96,format=png/https://cdn.metatft.com/file/metatft/${kind}/${name.toLowerCase()}.png`

// Icons are drawn into the canvas, so they must load with CORS or the canvas
// becomes tainted and can no longer be encoded.
const images = {}
function loadImage(url) {
  if (!images[url]) {
    images[url] = new Promise((resolve) => {
      const img = new Image()
      img.crossOrigin = "anonymous"
      img.onload = () => { images[url].img = img; resolve(img) }
      img.onerror = () => resolve(null)
      img.src = url
    })
  }
  return images[url]
}
const imageOf = (url) => images[url]?.img

// Recolours augment art to one colour (or the prismatic rainbow) by the
// brightness of each pixel. MetaTFT's glyphs are pink strokes
// in a blue glow, so for those only the red channel counts, which drops the glow.
function tintImage(img, color, glyph) {
  const c = Object.assign(document.createElement("canvas"), { width: img.width, height: img.height })
  const x = c.getContext("2d")
  x.drawImage(img, 0, 0)
  const d = x.getImageData(0, 0, c.width, c.height)
  const rgb = color === "prism" ? null : [1, 3, 5].map((k) => parseInt(color.slice(k, k + 2), 16))
  for (let k = 0; k < d.data.length; k += 4) {
    const p = d.data
    const v = glyph ? (p[k] / 255) ** 1.5 : Math.max(p[k], p[k + 1], p[k + 2]) / 255
    // Near-black backdrops some icons ship with fade out instead of
    // showing as dark squares.
    const l = Math.max(0, (v - 0.08) / 0.92)
    p[k + 3] *= Math.min(1, l * 4)
    let [r, g, b] = rgb || prismAt((k / 4) % c.width / c.width, Math.floor(k / 4 / c.width) / c.height)
    p[k] = r * l
    p[k + 1] = g * l
    p[k + 2] = b * l
  }
  x.putImageData(d, 0, 0)
  return c
}

// Pastel hue sweep across the icon diagonal.
function prismAt(u, v) {
  const h = ((u + v) / 2) * 300 + 170
  const f = (n) => {
    const k = (n + h / 30) % 12
    return 255 * (0.78 - 0.22 * Math.max(-1, Math.min(k - 3, 9 - k, 1)))
  }
  return [f(0), f(8), f(4)]
}

const FONT = '"Nanum Gothic", -apple-system, sans-serif'
const W = 960, H = 540
const canvas = Object.assign(document.createElement("canvas"), { width: W, height: H })
const ctx = canvas.getContext("2d")
const video = document.getElementById("video")
const listEl = document.getElementById("list")

let comps = []
let idx = 0
let mode = 0 // 0 summary, 1 detail, 2 items, 3 augment tiers; cycled by PiP play/pause
let augPage = 0
let augPages = []
let lookups = null // unit/item helpers from buildComps, reused for comp details

function tierOf(avg) {
  return avg < 4.25 ? "S" : avg < 4.5 ? "A" : avg < 4.75 ? "B" : avg < 5 ? "C" : "D"
}

function levelText(s) {
  if (!s) return ""
  const m = s.match(/lvl (\d+)/i)
  if (m) return `${m[1]}레벨 리롤`
  const f = s.match(/fast (\d+)/i)
  return f ? `빠른 ${f[1]}` : s
}

function isEmblem(item) {
  const api = item?.apiName || ""
  return (item?.tags || []).includes("Emblem") || api.includes("Emblem") ||
    (item?.composition || []).some((c) => c === "TFT_Item_Spatula" || c === "TFT_Item_FryingPan")
}

function buildComps(raw, stats, lk, buildsById) {
  const unitByAsset = {}
  for (const u of lk.units) for (const a of u.assetNames || []) unitByAsset[a] = u
  for (const [asset, api] of Object.entries(lk.unitAssetNames || {})) {
    if (!unitByAsset[asset]) unitByAsset[asset] = lk.units.find((u) => u.apiName === api)
  }
  const nameOf = {}
  for (const t of lk.traits) nameOf[t.apiName] = t.name
  for (const i of lk.items) nameOf[i.apiName] = i.name
  const unitName = (a) => unitByAsset[a]?.name || a.replace(/^DA_(18_)?|18$/g, "")
  const unitIcon = (a) => ICON("champions", unitByAsset[a]?.apiName || a)
  const itemName = (a) => nameOf[a] || a.replace(/^DA_(18_)?/, "")
  const unitOf = (a) => ({ asset: a, name: unitName(a), cost: unitByAsset[a]?.cost || 1, icon: unitIcon(a) })

  const details = raw.results.data.cluster_details
  const itemByApi = {}
  for (const i of lk.items) itemByApi[i.apiName] = i
  const isArtifact = (i) => (itemByApi[i]?.tags || []).includes("Artifact")
  const itemsOf = (b) => b.buildName.map((i) => ({ name: itemName(i), icon: ICON("items", i), artifact: isArtifact(i) }))
  lookups = { unitOf, itemName, itemByApi }
  const total = stats.results.find((r) => r.cluster === "").places[0]

  // Placement histogram -> avg, then the site's default hiding rules: low pick
  // rate, augment-gated or emblem-gated comps, and weak clusters; D tier is
  // dropped too.
  return stats.results
    .filter((r) => r.cluster !== "" && r.cluster !== "-1" && details[r.cluster])
    .map((r) => {
      const places = r.places.slice(0, 8)
      const count = places.reduce((a, b) => a + b, 0)
      const avg = places.reduce((a, n, k) => a + (k + 1) * n, 0) / count
      return { c: details[r.cluster], id: r.cluster, avg, pick: count / total * 8 }
    })
    .filter(({ c, pick }) =>
      pick >= MIN_PICK_RATE &&
      !c.name_string.includes("Augment") &&
      !(c.top_itemNames || []).some((t) => t.pcnt >= 0.5 && isEmblem(itemByApi[t.itemNames])) &&
      Math.max(...c.centroid) >= 1)
    .filter(({ avg }) => tierOf(avg) !== "D")
    .sort((a, b) => a.avg - b.avg)
    .map(({ c, id, avg, pick }) => {
      // `stars` lists units commonly 3-starred in this cluster; it can name
      // units outside the final board, so only mark the ones on it.
      const stars = new Set(c.stars || [])
      const units = c.units_string.split(", ").map((a) => ({
        asset: a,
        name: unitName(a),
        cost: unitByAsset[a]?.cost || 1,
        icon: unitIcon(a),
        three: stars.has(a),
      })).sort((a, b) => a.cost - b.cost)

      const traitCount = {}
      for (const a of c.units_string.split(", ")) {
        for (const t of unitByAsset[a]?.traits || []) traitCount[t] = (traitCount[t] || 0) + 1
      }
      const traits = Object.entries(traitCount)
        .filter(([, n]) => n >= 2)
        .sort((a, b) => b[1] - a[1])
        .map(([t, n]) => `${t} ${n}`)

      // Top 3 carries by their most played 3-item build, each with its three
      // most played builds and the most played build that uses an artifact.
      const byUnit = {}
      for (const b of buildsById[id]?.builds || c.builds || []) {
        if (b.num_items === 3) (byUnit[b.unit] ||= []).push(b)
      }
      for (const v of Object.values(byUnit)) v.sort((a, b) => b.count - a.count)
      const carries = Object.values(byUnit)
        .sort((a, b) => b[0].count - a[0].count)
        .slice(0, 3)
        .map((v) => {
          const [best] = v
          const art = v.find((b) => b.buildName.some(isArtifact))
          return {
            name: unitName(best.unit),
            icon: unitIcon(best.unit),
            cost: unitByAsset[best.unit]?.cost || 1,
            three: stars.has(best.unit),
            items: itemsOf(best),
            builds: v.filter((b) => !b.buildName.some(isArtifact)).slice(0, 3).map((b) => ({ items: itemsOf(b), avg: b.avg })),
            art: art && { items: itemsOf(art), avg: art.avg },
          }
        })

      const title = c.name.map((n) => (n.type === "unit" ? unitName(n.name) : nameOf[n.name] || n.name)).join(" ")
      return {
        id,
        title,
        avg,
        pick,
        tier: tierOf(avg),
        level: levelText(c.levelling),
        units, traits, carries,
        board: null, emblems: [], variants: [],
      }
    })
}

// The site's tier list, S and A only, by augment rarity. "+"/"++" variants
// are the same augment and collapse into the first (best tiered) one. Each
// tier starts its own rows; pages hold AUG_ROWS rows.
function buildAugPages(tierList, lk, augIcons) {
  const tiers = tierList?.content?.content?.tierList
  if (!tiers) return []
  const augByApi = {}
  for (const a of lk.augments || []) augByApi[a.apiName] = a
  const pages = []
  for (const [rarity, label, tint] of RARITIES) {
    const seen = new Set()
    const rows = []
    for (const t of tiers.filter((t) => t.label === "S" || t.label === "A")) {
      const augs = t.content
        .map((x) => augByApi[x.id])
        .filter((d) => d?.rarity === rarity)
        .map((d) => ({ d, name: d.name.replace(/\+*$/, "") }))
        .filter(({ name }) => !seen.has(name) && seen.add(name))
        .map(({ d, name }) => {
          const art = augIcons[d.apiName]
          const src = art ? CDRAGON_ICON(art) : ICON("augments", d.apiName)
          return { name, src, tint, glyph: !art, icon: `${src}#${tint}` }
        })
      for (let k = 0; k < augs.length; k += AUG_COLS) rows.push({ tier: t.label, first: k === 0, augs: augs.slice(k, k + AUG_COLS) })
    }
    for (let k = 0; k < rows.length; k += AUG_ROWS) pages.push({ label, rows: rows.slice(k, k + AUG_ROWS) })
  }
  return pages
}

// comp_details is fetched per comp, a few at a time; only the parts drawn
// are kept.
async function fetchDetails(ids, clusterId) {
  const out = {}
  let next = 0
  await Promise.all(Array.from({ length: 6 }, async () => {
    while (next < ids.length) {
      const id = ids[next++]
      try {
        const r = (await (await fetch(DETAILS_URL(id, clusterId), { cache: "no-store" })).json()).results
        out[id] = r && { positions: r.positioning?.units, options: r.options, itemNames: r.itemNames }
      } catch {
        out[id] = null
      }
    }
  }))
  return out
}

const MIN_SAMPLE = 50
const MAX_SWAP = 4

function addDetails(c, det) {
  if (!det) return
  c.board = placeBoard(det.positions, c.units)

  // Most used emblems in this comp, each with the two units holding it most.
  c.emblems = (det.itemNames || [])
    .filter((x) => isEmblem(lookups.itemByApi[x.itemNames]) && x.count >= MIN_SAMPLE)
    .sort((a, b) => b.count - a.count)
    .slice(0, 3)
    .map((x) => ({
      name: lookups.itemName(x.itemNames),
      icon: ICON("items", x.itemNames),
      units: (x.units || [])
        .filter((u) => u.count >= MIN_SAMPLE / 2)
        .sort((a, b) => b.count - a.count)
        .slice(0, 2)
        .map((u) => ({ ...lookups.unitOf(u.units), avg: u.avg })),
    }))

  // Variants: for the levels the comp mostly ends at, the best scoring board
  // that differs from the main one, shown as units added and removed.
  const main = new Set(c.units.map((u) => u.asset))
  c.variants = Object.entries(det.options || {})
    .map(([level, opts]) => ({ level: Number(level), opts, total: opts.reduce((n, o) => n + o.count, 0) }))
    .sort((a, b) => b.total - a.total)
    .slice(0, 4)
    .sort((a, b) => a.level - b.level)
    .map(({ level, opts }) => {
      // A board that swaps more than MAX_SWAP units is another comp, not a variant.
      const o = [...opts].sort((a, b) => b.score - a.score).find((o) => {
        const us = new Set(o.units_list.split("&"))
        const swaps = [...us].filter((u) => !main.has(u)).length + [...main].filter((u) => !us.has(u)).length
        return o.count >= MIN_SAMPLE && swaps > 0 && swaps <= MAX_SWAP
      })
      if (!o) return null
      const us = new Set(o.units_list.split("&"))
      return {
        level,
        avg: o.avg,
        added: [...us].filter((u) => !main.has(u)).map(lookups.unitOf),
        removed: [...main].filter((u) => !us.has(u)).map(lookups.unitOf),
      }
    })
    .filter(Boolean)
}

// Each unit takes its most common free cell, most settled units first, the
// same way metatft.com fills its board. Returns cell number -> unit.
function placeBoard(positions, units) {
  if (!positions) return null
  const board = new Map()
  const placed = units
    .filter((u) => positions[u.asset]?.positions?.length)
    .sort((a, b) => positions[b.asset].positions[0].count - positions[a.asset].positions[0].count)
  for (const u of placed) {
    const p = positions[u.asset].positions.find((p) => !board.has(Number(p.cell.slice(5))))
    if (p) board.set(Number(p.cell.slice(5)), u)
  }
  return board
}

function drawIcon(url, label, x, y, size, border) {
  if (border) {
    ctx.fillStyle = border
    ctx.fillRect(x - 3, y - 3, size + 6, size + 6)
  }
  const img = imageOf(url)
  if (img) {
    ctx.drawImage(img, x, y, size, size)
  } else {
    ctx.fillStyle = "#222"
    ctx.fillRect(x, y, size, size)
    ctx.fillStyle = "#fff"
    ctx.font = `bold 16px ${FONT}`
    ctx.textAlign = "center"
    ctx.fillText(label.slice(0, 4), x + size / 2, y + size / 2 - 8, size - 4)
    ctx.textAlign = "left"
  }
}

function drawUnit(u, x, y, size) {
  drawIcon(u.icon, u.name, x, y, size, COST_COLORS[u.cost] || "#666")
  if (!u.three) return
  ctx.font = `bold ${Math.round(size * 0.3)}px ${FONT}`
  ctx.textAlign = "center"
  ctx.lineWidth = 4
  ctx.strokeStyle = "#000"
  ctx.strokeText("★★★", x + size / 2, y - size * 0.32) // taste-skill-ignore: the game's star level
  ctx.fillStyle = C.accent
  ctx.fillText("★★★", x + size / 2, y - size * 0.32) // taste-skill-ignore: the game's star level
  ctx.textAlign = "left"
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath()
  ctx.roundRect(x, y, w, h, r)
}

// Header: tier badge, rank, title
function drawHeader(c, i, sub) {
  ctx.fillStyle = TIER_STYLE[c.tier].bg
  roundRect(30, 28, 64, 64, 14)
  ctx.fill()
  ctx.fillStyle = TIER_STYLE[c.tier].fg
  ctx.font = `bold 46px ${FONT}`
  ctx.textAlign = "center"
  ctx.fillText(c.tier, 62, 36)
  ctx.textAlign = "left"
  ctx.fillStyle = "#fff"
  ctx.font = `bold 46px ${FONT}`
  ctx.fillText(`${i + 1}. ${c.title}`, 112, 32, W - 140)
  ctx.fillStyle = C.muted
  ctx.font = `26px ${FONT}`
  ctx.fillText(sub, 112, 86)
}

function draw(m = mode, i = posOf(m)) {
  ctx.fillStyle = C.ground
  ctx.fillRect(0, 0, W, H)
  ctx.textBaseline = "top"
  ctx.textAlign = "left"
  if (m === 3 && augPages[i]) return drawAugPage(augPages[i], i)
  const c = comps[i]
  if (!c) {
    ctx.fillStyle = "#fff"
    ctx.font = `40px ${FONT}`
    ctx.fillText("불러오는 중...", 40, 40)
    return
  }
  if (m === 1) return drawDetail(c, i)
  if (m === 2) return drawItems(c, i)

  drawHeader(c, i, `평균 ${c.avg.toFixed(2)}등 · ${c.level}`)

  // Units as cost-bordered portraits, gold stars on the ones to 3-star
  const n = c.units.length
  const size = Math.min(100, Math.floor((W - 60 - (n - 1) * 8) / n))
  let x = 30
  for (const u of c.units) {
    drawUnit(u, x, 156, size)
    x += size + 8
  }

  // Carries: portrait plus their three items
  const colW = (W - 60) / 3
  c.carries.forEach((k, j) => {
    const cx = 30 + j * colW
    drawUnit(k, cx, 330, 84)
    k.items.forEach((it, m) => drawIcon(it.icon, it.name, cx + 94 + m * 66, 342, 60, "#444"))
  })

  // Traits
  ctx.fillStyle = C.muted
  ctx.font = `24px ${FONT}`
  ctx.fillText(c.traits.join("  "), 30, H - 50, W - 60)
  ctx.fillStyle = C.faint
  ctx.textAlign = "right"
  ctx.fillText(`${i + 1}/${comps.length}`, W - 30, H - 50)
}

function hexPath(cx, cy, r) {
  ctx.beginPath()
  for (let k = 0; k < 6; k++) {
    const a = Math.PI / 3 * k + Math.PI / 6
    ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a))
  }
  ctx.closePath()
}

// 4×7 board, front row on top. Cells are numbered like metatft.com: 22-28
// across the front row, 1-7 across the back row.
function drawBoard(board, x0, y0, r) {
  const hexW = Math.sqrt(3) * r
  for (let n = 1; n <= 28; n++) {
    const row = Math.floor((28 - n) / 7), col = 6 - (28 - n) % 7
    const cx = x0 + hexW * (col + 0.5) + (row % 2) * hexW / 2
    const cy = y0 + r + row * r * 1.5
    const u = board?.get(n)
    hexPath(cx, cy, r - 2)
    ctx.fillStyle = "#161616"
    ctx.fill()
    if (!u) {
      ctx.strokeStyle = C.ground
      ctx.lineWidth = 2
      ctx.stroke()
      continue
    }
    const img = imageOf(u.icon)
    if (img) {
      ctx.save()
      ctx.clip()
      ctx.drawImage(img, cx - r, cy - r, 2 * r, 2 * r)
      ctx.restore()
    } else {
      ctx.fillStyle = "#fff"
      ctx.font = `bold 15px ${FONT}`
      ctx.textAlign = "center"
      ctx.fillText(u.name.slice(0, 3), cx, cy - 8, 2 * r - 8)
      ctx.textAlign = "left"
    }
    hexPath(cx, cy, r - 2)
    ctx.strokeStyle = COST_COLORS[u.cost] || "#666"
    ctx.lineWidth = 4
    ctx.stroke()
    if (u.three) {
      ctx.font = `bold 16px ${FONT}`
      ctx.textAlign = "center"
      ctx.lineWidth = 3
      ctx.strokeStyle = "#000"
      ctx.strokeText("★★★", cx, cy + r - 22) // taste-skill-ignore: the game's star level
      ctx.fillStyle = C.accent
      ctx.fillText("★★★", cx, cy + r - 22) // taste-skill-ignore: the game's star level
      ctx.textAlign = "left"
    }
  }
  if (!board) {
    ctx.fillStyle = C.faint
    ctx.font = `24px ${FONT}`
    ctx.fillText("배치 데이터 없음", x0 + hexW * 2.2, y0 + r * 2.4)
  }
}

function label(text, x, y) {
  ctx.fillStyle = C.muted
  ctx.font = `bold 22px ${FONT}`
  ctx.fillText(text, x, y)
}

function avgText(avg, x, y) {
  ctx.fillStyle = C.muted
  ctx.font = `18px ${FONT}`
  ctx.fillText(`${avg.toFixed(2)}등`, x, y)
}

function pageNumber(i, left = false) {
  ctx.fillStyle = C.faint
  ctx.font = `24px ${FONT}`
  ctx.textAlign = left ? "left" : "right"
  ctx.fillText(`${i + 1}/${comps.length}`, left ? 30 : W - 30, H - 36)
  ctx.textAlign = "left"
}

// Second page of a comp: board positioning on the left; recommended emblems
// and level variants on the right.
function drawDetail(c, i) {
  drawHeader(c, i, `상세 · 평균 ${c.avg.toFixed(2)}등 · ${c.level}`)
  drawBoard(c.board, 24, 200, 36)

  const x0 = 520
  label("추천 상징", x0, 124)
  if (!c.emblems.length) {
    ctx.fillStyle = C.faint
    ctx.font = `18px ${FONT}`
    ctx.fillText("데이터 없음", x0, 160)
  }
  c.emblems.forEach((e, j) => {
    const y = 156 + j * 54
    drawIcon(e.icon, e.name, x0, y, 42, null)
    e.units.forEach((u, n) => {
      const x = x0 + 62 + n * 172
      drawIcon(u.icon, u.name, x, y, 42, COST_COLORS[u.cost])
      avgText(u.avg, x + 52, y + 12)
    })
  })

  label("변형 덱", x0, 330)
  c.variants.forEach((v, j) => {
    const y = 362 + j * 44
    ctx.fillStyle = C.text
    ctx.font = `bold 18px ${FONT}`
    ctx.fillText(`${v.level}레벨`, x0, y + 10)
    let x = x0 + 62
    for (const [sign, list, color] of [["+", v.added, C.accent], ["−", v.removed, C.negative]]) {
      if (!list.length) continue
      ctx.fillStyle = color
      ctx.font = `bold 24px ${FONT}`
      ctx.fillText(sign, x, y + 5)
      x += 20
      for (const u of list) {
        ctx.globalAlpha = sign === "−" ? 0.55 : 1
        drawIcon(u.icon, u.name, x, y, 34, sign === "−" ? C.raised : COST_COLORS[u.cost])
        ctx.globalAlpha = 1
        x += 42
      }
      x += 6
    }
    avgText(v.avg, Math.max(x + 4, W - 110), y + 10)
  })
  if (!c.variants.length) {
    ctx.fillStyle = C.faint
    ctx.font = `18px ${FONT}`
    ctx.fillText("데이터 없음", x0, 366)
  }
  // Bottom-left: a fourth variant row reaches the bottom-right corner.
  pageNumber(i, true)
}

// Third page of a comp: each carry's three most played builds, then the
// build to aim for once an artifact shows up.
function drawItems(c, i) {
  drawHeader(c, i, `아이템 · 평균 ${c.avg.toFixed(2)}등 · ${c.level}`)
  const colW = (W - 60) / 3
  c.carries.forEach((k, j) => {
    const x0 = 30 + j * colW
    drawUnit(k, x0, 140, 56)
    ctx.fillStyle = "#fff"
    ctx.font = `bold 24px ${FONT}`
    ctx.fillText(k.name, x0 + 70, 156, colW - 80)
    const rows = [...k.builds.map((b, n) => [`${n + 1}순위`, b]), ["유물", k.art]]
    rows.forEach(([name, b], n) => {
      const y = 226 + n * 66
      ctx.fillStyle = name === "유물" ? ARTIFACT_COLOR : C.muted
      ctx.font = `bold 18px ${FONT}`
      ctx.fillText(name, x0, y + 14)
      if (!b) {
        ctx.fillStyle = C.faint
        ctx.font = `18px ${FONT}`
        ctx.fillText("없음", x0 + 58, y + 14)
        return
      }
      b.items.forEach((it, m) => drawIcon(it.icon, it.name, x0 + 58 + m * 50, y, 42, it.artifact ? ARTIFACT_COLOR : "#444"))
      avgText(b.avg, x0 + 210, y + 12)
    })
  })
  pageNumber(i)
}

// Third view: augment tier list page, one tier per block of rows.
function drawAugPage(p, k) {
  ctx.fillStyle = "#fff"
  ctx.font = `bold 46px ${FONT}`
  ctx.fillText(`증강 티어 · ${p.label}`, 30, 26)
  ctx.fillStyle = C.muted
  ctx.font = `24px ${FONT}`
  ctx.fillText(`${k + 1}/${augPages.length}`, 30, 80)
  const x0 = 80, cellW = (W - x0 - 20) / AUG_COLS, rowH = 66, gap = 16
  let y = 118 - rowH
  p.rows.forEach((row, r) => {
    // A new tier starts below a divider with some room for the names above.
    y += rowH + (row.first && r > 0 ? gap : 0)
    if (row.first || r === 0) {
      ctx.fillStyle = row.tier === "S" ? C.accent : C.text
      ctx.font = `800 36px ${FONT}`
      ctx.fillText(row.tier, 34, y + 4)
      if (r > 0) {
        ctx.fillStyle = C.raised
        ctx.fillRect(30, y - gap / 2 - 3, W - 60, 2)
      }
    }
    row.augs.forEach((a, n) => {
      const x = x0 + n * cellW
      drawIcon(a.icon, a.name, x + (cellW - 46) / 2, y, 46, null)
      ctx.fillStyle = C.text
      ctx.font = `15px ${FONT}`
      ctx.textAlign = "center"
      ctx.fillText(a.name, x + cellW / 2, y + 48, cellW - 4)
      ctx.textAlign = "left"
    })
  })
}

function renderList() {
  const shown = comps.map((c, i) => [c, i])
  listEl.innerHTML = `<div class="head"><span>덱</span><span>평균 등수</span></div>`
  for (const [c, i] of shown) {
    const el = document.createElement("button")
    el.className = "row"
    el.setAttribute("aria-current", String(i === idx && mode !== 3))
    const t = TIER_STYLE[c.tier]
    el.innerHTML = `<span class="tier" style="background:${t.bg};color:${t.fg}">${c.tier}</span>
      <span class="name"><b>${i + 1}. ${c.title}</b><small>${c.level || ""}</small></span>
      <span class="avg num">${c.avg.toFixed(2)}</span>`
    el.onclick = () => select(i)
    listEl.appendChild(el)
  }
}

// Every page becomes a SEG-second still segment of a real MP4, so the PiP
// skip ±10s buttons land exactly on the previous/next page. The video holds
// one track per view (summaries, details, augment tier pages) back to back;
// skipping inside a track pages within that view.
const SEG = 10
let fileMode = false
let videoUrl = null
const MODE_NAMES = ["요약", "상세", "아이템", "증강 티어"]
const modeCount = () => (augPages.length ? 4 : 3)
const trackLen = (m) => (m === 3 ? augPages.length : comps.length)
// Each track is wrapped in copies of its own last and first page, so a skip
// past either end lands on the right picture straight away (then quietly
// moves to the real page) instead of in a neighbouring track or past the
// end of the video.
const trackStart = (m) => { let s = 0; for (let k = 0; k < m; k++) s += trackLen(k) + 2; return s }
const trackPages = (m) => { const n = trackLen(m); return [n - 1, ...Array.from({ length: n }, (_, k) => k), 0] }
const posOf = (m) => (m === 3 ? augPage : idx)
const segStart = () => (trackStart(mode) + 1 + posOf(mode)) * SEG

function show(m, k) {
  if (!comps.length) return
  const n = trackLen(m)
  k = ((k % n) + n) % n
  mode = m
  if (m === 3) augPage = k
  else idx = k
  if (fileMode) seekTo(segStart() + 0.5)
  else draw()
  renderList()
}
// Picking a comp from the list leaves the augment view for its summary.
const select = (i) => show(mode === 3 ? 0 : mode, i)
const step = (d) => show(mode, posOf(mode) + d)
const cycleMode = () => { const m = (mode + 1) % modeCount(); show(m, posOf(m)) }

// Seeks we issue ourselves (paging, holding) must not be mistaken for the
// PiP skip buttons. They are recognised by their target time rather than a
// flag, which could get stuck if iOS coalesces or drops a seeked event.
let selfTarget = -1
function seekTo(t, hold = false) {
  selfTarget = t
  lastTime = t
  if (hold) lastHoldSeekAt = Date.now()
  video.currentTime = t
}
const isSelfSeek = () => Math.abs(video.currentTime - selfTarget) < 0.3

// The video keeps playing so PiP always repaints (a paused PiP ignores seeks
// visually); playback is held inside the current segment instead.
// A PiP skip is read as a direction from where the video last was, never
// as an absolute time: iOS can reload the video in the background and reset
// it to 0s, and a skip from there used to land on comp 1. A jump that is no
// skip (a reset, a resume from elsewhere) puts the current page back.
let lastTime = 0
video.addEventListener("seeking", () => {
  if (!fileMode || !comps.length || isSelfSeek()) return
  // Still inside our page (iOS may snap our own seek to the keyframe).
  if (Math.floor(video.currentTime / SEG) === Math.floor(segStart() / SEG)) return
  const delta = video.currentTime - lastTime
  log(`skip ${lastTime.toFixed(1)}s → ${video.currentTime.toFixed(1)}s`)
  if (Math.abs(delta) > 3 && Math.abs(delta) < 30) step(Math.sign(delta))
  else show(mode, posOf(mode))
})
video.addEventListener("timeupdate", () => {
  if (!fileMode || video.seeking) return
  lastTime = video.currentTime
  const t0 = segStart()
  if (video.currentTime >= t0 + SEG - 1.5 || video.currentTime < t0) seekTo(t0 + 0.5, true)
})

// Play/pause in PiP cycles summary → detail → items → augment tiers, and
// the video resumes right away so it never sits paused. Every tap counts,
// however fast: when a tap lands while the video is still paused (our resume
// not yet through, or refused by iOS in the background) it arrives as "play",
// so a play we did not start ourselves toggles too. Only the pause iOS adds
// by itself right after our periodic segment-hold seek is ignored.
let lastToggle = 0, lastHoldSeekAt = 0, expectSelfPlay = false
function resume() {
  if (!video.paused) return
  expectSelfPlay = true
  video.play().catch((e) => {
    expectSelfPlay = false // refused: the next play is the user's
    log("재생 재개 실패: " + e.message)
  })
}
function userToggle(kind) {
  const now = Date.now()
  if (now - lastHoldSeekAt < 600) return log(`${kind} 무시 (구간 유지 탐색 직후)`)
  if (now - lastToggle < 60) return // one tap reported twice
  lastToggle = now
  cycleMode()
  log(`${kind} → ${MODE_NAMES[mode]}`)
}
video.addEventListener("pause", () => {
  if (!fileMode || !comps.length) return
  userToggle("pause")
  resume()
})
video.addEventListener("play", () => {
  if (expectSelfPlay) { expectSelfPlay = false; return }
  if (!fileMode || !comps.length) return
  userToggle("play")
})

for (const ev of ["waiting", "stalled", "emptied", "abort"]) {
  video.addEventListener(ev, () => log(`video ${ev} @${video.currentTime.toFixed(1)}s`))
}
// A decoder lost while the game hogs the GPU/memory: reattach the same file.
video.addEventListener("error", () => {
  if (!fileMode || !videoUrl) return
  log(`video error ${video.error?.code}: ${video.error?.message || ""} → 다시 연결`)
  video.src = videoUrl
})

// Watchdog: if playback ends up paused anyway or stops advancing, nudge it.
let lastPos = -1, stuckFor = 0
setInterval(() => {
  const pip = video.webkitPresentationMode === "picture-in-picture" || !!document.pictureInPictureElement
  if (!fileMode || (document.hidden && !pip)) return
  if (video.paused) {
    log("watchdog: 멈춤 감지 → 재생")
    resume()
    return
  }
  if (video.currentTime === lastPos && !video.seeking) {
    if (++stuckFor >= 3) {
      log(`watchdog: 재생 정지 ${stuckFor * 2}초 → 위치 재설정`)
      stuckFor = 0
      seekTo(segStart() + 0.5, true)
    }
  } else {
    stuckFor = 0
  }
  lastPos = video.currentTime
}, 2000)

async function buildVideo() {
  if (!("VideoEncoder" in window)) throw new Error("VideoEncoder 미지원")
  const { Muxer, ArrayBufferTarget } = await import(MUXER_URL)
  const config = { codec: "avc1.42001f", width: W, height: H, bitrate: 500_000, framerate: 1 }
  if (!(await VideoEncoder.isConfigSupported(config)).supported) throw new Error("H.264 인코딩 미지원")
  const target = new ArrayBufferTarget()
  const muxer = new Muxer({ target, video: { codec: "avc", width: W, height: H }, fastStart: "in-memory" })
  let encError = null
  const enc = new VideoEncoder({
    output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
    error: (e) => { encError = e },
  })
  enc.configure(config)
  const views = []
  for (let m = 0; m < modeCount(); m++) for (const i of trackPages(m)) views.push([m, i])
  for (let k = 0; k < views.length; k++) {
    draw(...views[k])
    // Constant 1 fps so iOS can seek. Only each segment's first frame is a
    // keyframe; the rest repeat it as near-empty delta frames, which keeps the
    // file (held in memory next to the game) several times smaller.
    for (let sec = 0; sec < SEG; sec++) {
      // encode() returns before encoding and keeps a full-size copy of each
      // queued frame (~2MB); unthrottled, all of them piled up (gigabytes)
      // and iOS killed the page. Wait for the queue to drain a little.
      while (enc.encodeQueueSize > 4) await new Promise((r) => setTimeout(r, 2))
      if (encError) throw encError
      const f = new VideoFrame(canvas, { timestamp: (k * SEG + sec) * 1e6, duration: 1e6 })
      enc.encode(f, { keyFrame: sec === 0 })
      f.close()
    }
  }
  await enc.flush()
  if (encError) throw encError
  muxer.finalize()
  log(`영상 크기 ${(target.buffer.byteLength / 1e6).toFixed(1)}MB`)
  return new Blob([target.buffer], { type: "video/mp4" })
}

document.getElementById("prev").onclick = () => step(-1)
document.getElementById("next").onclick = () => step(1)

// Live-stream fallback until (or unless) the MP4 is ready.
draw()
let streamTimer = setInterval(() => { if (!fileMode) draw() }, 500)
video.srcObject = canvas.captureStream(10)
resume()

// PiP must be requested synchronously inside the tap handler, while playing.
video.addEventListener("webkitpresentationmodechanged", () => log("모드: " + video.webkitPresentationMode))
document.addEventListener("visibilitychange", () => log(document.hidden ? "페이지 숨김" : "페이지 보임"))

document.getElementById("pip").onclick = () => {
  log("PiP 버튼 눌림 (" + (fileMode ? "영상" : "스트림") + " 모드)")
  resume()
  try {
    if (video.webkitSupportsPresentationMode && video.webkitSupportsPresentationMode("picture-in-picture")) {
      video.webkitSetPresentationMode("picture-in-picture")
    } else if (document.pictureInPictureEnabled) {
      video.requestPictureInPicture().catch((e) => log("실패: " + e.message))
    } else {
      log("PiP 미지원")
    }
  } catch (e) {
    log("실패: " + e.message)
  }
}

// The built video and the comp list are kept in Cache Storage for a day, so
// reopening the page skips the downloads and the encoding. A page left open
// reloads once the data is a day old, but never while PiP is up since a
// reload would close it. Bump CACHE_VERSION whenever the drawing changes.
const CACHE_NAME = "tftpip", CACHE_VERSION = 4
const META_KEY = "./cache/meta.json", VIDEO_KEY = "./cache/video.mp4"
const REFRESH_MS = 24 * 60 * 60 * 1000
let dataSavedAt = Date.now()
function refreshIfStale() {
  if (Date.now() - dataSavedAt < REFRESH_MS) return
  if (video.webkitPresentationMode === "picture-in-picture" || document.pictureInPictureElement) return
  location.reload()
}
setInterval(refreshIfStale, 10 * 60 * 1000)
document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshIfStale() })
document.getElementById("reload").onclick = async () => {
  await caches.delete(CACHE_NAME).catch(() => {})
  location.reload()
}

const shortTime = (t) => new Date(t).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })
const clockTime = (t) => new Date(t).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", hour12: false })
function showUpdated(updated) {
  document.getElementById("fresh").textContent = `${clockTime(dataSavedAt)} 받음`
  document.getElementById("updated").textContent =
    `MetaTFT 통계 ${shortTime(updated)} 기준 · 현재 패치 최근 3일 플래티넘 이상 · 받은 지 하루가 지나면 새로 받아요`
}

// PiP stays off until the final video is in place: swapping the source under
// an open PiP window (live stream → file) can break it.
function enablePip() {
  const b = document.getElementById("pip")
  b.disabled = false
  b.textContent = "PiP 시작"
}

function startVideo(blob) {
  clearInterval(streamTimer)
  video.srcObject = null
  videoUrl = URL.createObjectURL(blob)
  video.loop = true
  video.src = videoUrl
  fileMode = true
  // Also after any later reload of the media (decoder error, or iOS
  // reloading it in the background), which starts again from 0s.
  video.addEventListener("loadedmetadata", () => {
    // Slow playback: the picture is still, and the segment hold (with the
    // pauses iOS throws in around it) then comes every ~30s, not every ~8s.
    video.defaultPlaybackRate = video.playbackRate = 0.25
    show(mode, posOf(mode))
    resume()
    enablePip()
  })
  log("영상 모드: PiP ±10초 = 이전/다음, ⏯ = 요약 → 상세 → 아이템 → 증강 티어")
}

async function loadCached() {
  if (!("caches" in window)) return false
  try {
    const cache = await caches.open(CACHE_NAME)
    const meta = await (await cache.match(META_KEY))?.json()
    if (!meta || meta.version !== CACHE_VERSION || Date.now() - meta.savedAt > REFRESH_MS) return false
    const blob = await (await cache.match(VIDEO_KEY))?.blob()
    if (!blob) return false
    dataSavedAt = meta.savedAt
    // Only what the list and paging need; the pages themselves are in the video.
    comps = meta.comps
    augPages = Array.from({ length: meta.augPages }, () => null)
    renderList()
    showUpdated(meta.updated)
    log(`저장된 데이터 사용 (${new Date(meta.savedAt).toLocaleString("ko-KR")} 받음, 영상 ${(blob.size / 1e6).toFixed(1)}MB)`)
    startVideo(blob)
    return true
  } catch (e) {
    log("저장된 데이터 읽기 실패: " + e.message)
    return false
  }
}

async function saveCache(blob, updated) {
  if (!("caches" in window)) return
  try {
    const cache = await caches.open(CACHE_NAME)
    const meta = {
      version: CACHE_VERSION,
      savedAt: dataSavedAt,
      updated,
      comps: comps.map(({ title, tier, avg, level }) => ({ title, tier, avg, level })),
      augPages: augPages.length,
    }
    await cache.put(VIDEO_KEY, new Response(blob, { headers: { "Content-Type": "video/mp4" } }))
    await cache.put(META_KEY, new Response(JSON.stringify(meta), { headers: { "Content-Type": "application/json" } }))
  } catch (e) {
    log("저장 실패: " + e.message)
  }
}

;(async () => {
  try {
    if (await loadCached()) return
    const raw = await (await fetch(COMPS_URL, { cache: "no-store" })).json()
    const set = raw.results.data.tft_set || raw.tft_set
    const [lk, stats, builds, tierList, augIcons] = await Promise.all([
      fetch(LOOKUP_URL(set)).then((r) => r.json()),
      fetch(STATS_URL(raw.cluster_id), { cache: "no-store" }).then((r) => r.json()),
      // The rest is optional; a failure only leaves those parts empty.
      fetch(BUILDS_URL(raw.cluster_id), { cache: "no-store" }).then((r) => r.json())
        .then((d) => d.results || {}).catch((e) => { log("아이템 통계 실패: " + e.message); return {} }),
      fetch(AUG_TIERLIST_URL, { cache: "no-store" }).then((r) => r.json())
        .catch((e) => { log("증강 티어 실패: " + e.message); return null }),
      fetch(AUG_ICONS_URL).then((r) => r.json())
        .then((d) => {
          if (d.set === set) return d.icons
          log(`증강 아이콘 목록이 ${d.set}용이라 기본 아이콘 사용`)
          return {}
        })
        .catch(() => ({})),
    ])
    comps = buildComps(raw, stats, lk, builds)
    augPages = tierList?.tft_set && tierList.tft_set !== set ? [] : buildAugPages(tierList, lk, augIcons)
    log(`${set} · 덱 ${comps.length}개 · 증강 티어 ${augPages.length}쪽 · 갱신 ${new Date(stats.updated).toLocaleString("ko-KR")}`)
    dataSavedAt = Date.now()
    showUpdated(stats.updated)
    renderList()
    const details = await fetchDetails(comps.map((c) => c.id), raw.cluster_id)
    for (const c of comps) addDetails(c, details[c.id])
    log(`상세 ${comps.filter((c) => c.board).length}/${comps.length}개`)
    const urls = new Set([
      ...comps.flatMap((c) => [
        ...c.units.map((u) => u.icon),
        ...c.carries.flatMap((k) => [k.icon, ...[k.items, ...k.builds.map((b) => b.items), k.art?.items].flat().filter(Boolean).map((it) => it.icon)]),
        ...c.emblems.flatMap((e) => [e.icon, ...e.units.map((u) => u.icon)]),
        ...c.variants.flatMap((v) => [...v.added, ...v.removed].map((u) => u.icon)),
      ]),
      ...augPages.flatMap((p) => p.rows.flatMap((r) => r.augs.map((a) => a.src))),
    ])
    const loaded = await Promise.all([...urls].map(loadImage))
    for (const a of augPages.flatMap((p) => p.rows.flatMap((r) => r.augs))) {
      const img = imageOf(a.src)
      if (img) images[a.icon] = { img: tintImage(img, a.tint, a.glyph) }
    }
    // Canvas text only uses a web font once it has loaded; load all weights.
    await Promise.all(["400", "700", "800"].map((w) => document.fonts.load(`${w} 24px "Nanum Gothic"`, "가A1")))
      .then((r) => { if (r.some((f) => !f.length)) log("글꼴 일부 실패") })
      .catch((e) => log("글꼴 실패: " + e.message))
    log(`아이콘 ${loaded.filter(Boolean).length}/${urls.size}개`)
    draw()
    try {
      const t0 = Date.now()
      const blob = await buildVideo()
      log(`영상 생성 ${((Date.now() - t0) / 1000).toFixed(1)}초`)
      startVideo(blob)
      saveCache(blob, stats.updated)
    } catch (e) {
      log("영상 생성 실패, 스트림 모드 사용: " + e.message)
      select(0)
      enablePip()
    }
  } catch (e) {
    listEl.innerHTML = `<p class="state">MetaTFT에서 덱을 불러오지 못했어요 (${e.message}). <button class="text" onclick="location.reload()">다시 시도</button></p>`
  }
})()
</script>
