<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TFT 덱 PiP</title>
<style>
  body { margin: 0; padding: 16px; background: #111; color: #eee; font: 15px -apple-system, sans-serif; }
  video { width: 100%; border-radius: 10px; background: #000; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  button, select { flex: 1; padding: 14px; font-size: 16px; border: 0; border-radius: 10px; background: #333; color: #fff; }
  button.primary { background: #0a84ff; }
  #list { margin-top: 12px; }
  .comp { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 8px; margin-bottom: 4px; background: #1c1c1e; }
  .comp.sel { outline: 2px solid #0a84ff; }
  .tier { width: 28px; text-align: center; font-weight: 700; border-radius: 6px; padding: 2px 0; color: #000; }
  .name { flex: 1; }
  .avg { color: #999; font-size: 13px; }
  #log { margin-top: 10px; font: 11px ui-monospace, monospace; color: #777; white-space: pre-wrap; }
</style>
</head>
<body>
<video id="video" muted playsinline></video>
<div class="row">
  <button id="prev">◀</button>
  <button id="pip" class="primary">PiP 시작</button>
  <button id="next">▶</button>
</div>
<div class="row">
  <select id="auto">
    <option value="0">자동 넘김 끔</option>
    <option value="10">10초마다 넘김</option>
    <option value="20">20초마다 넘김</option>
    <option value="40">40초마다 넘김</option>
  </select>
</div>
<div id="updated" class="avg"></div>
<div id="list">불러오는 중...</div>
<div id="log"></div>

<script>
window.onerror = (m, src, line) => { document.getElementById("log").textContent += `에러: ${m} (${line})\n` }
window.onunhandledrejection = (e) => { document.getElementById("log").textContent += `에러: ${e.reason}\n` }
const MUXER_URL = "https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.mjs"

// Shows MetaTFT ranked comps one at a time on a canvas that is streamed into a
// Picture-in-Picture video, so the guide floats over the game.
const COMPS_URL = "https://api-hc.metatft.com/tft-comps-api/comps_data?queue=1100"
const LOOKUP_URL = (set) => `https://data.metatft.com/lookups/${set}_latest_ko_kr.json`
// Same filters as the default metatft.com/comps view, so order and tiers match.
const STATS_URL = (clusterId) => "https://api-hc.metatft.com/tft-comps-api/comps_stats?queue=1100&patch=current&days=3" +
  `&rank=CHALLENGER,DIAMOND,EMERALD,GRANDMASTER,MASTER,PLATINUM&permit_filter_adjustment=true&cluster_id=${clusterId}`
const MIN_PICK_RATE = 0.01
const COST_COLORS = { 1: "#9aa4af", 2: "#22c55e", 3: "#3b82f6", 4: "#a855f7", 5: "#f5b301" }
const TIER_COLORS = { S: "#ff7a7a", A: "#ffb86b", B: "#ffe66b", C: "#9be08f", D: "#8ab4ff" }
const ICON = (kind, name) =>
  `https://cdn.metatft.com/cdn-cgi/image/width=96,height=96,format=png/https://cdn.metatft.com/file/metatft/${kind}/${name.toLowerCase()}.png`

// Icons are drawn into the canvas, so they must load with CORS or the canvas
// becomes tainted and can no longer be encoded.
const images = {}
function loadImage(url) {
  if (!images[url]) {
    images[url] = new Promise((resolve) => {
      const img = new Image()
      img.crossOrigin = "anonymous"
      img.onload = () => { images[url].img = img; resolve(img) }
      img.onerror = () => resolve(null)
      img.src = url
    })
  }
  return images[url]
}
const imageOf = (url) => images[url]?.img

const W = 960, H = 540
const canvas = Object.assign(document.createElement("canvas"), { width: W, height: H })
const ctx = canvas.getContext("2d")
const video = document.getElementById("video")
const listEl = document.getElementById("list")
const log = (m) => { document.getElementById("log").textContent += m + "\n" }

let comps = []
let idx = 0

function tierOf(avg) {
  return avg < 4.25 ? "S" : avg < 4.5 ? "A" : avg < 4.75 ? "B" : avg < 5 ? "C" : "D"
}

function levelText(s) {
  if (!s) return ""
  const m = s.match(/lvl (\d+)/i)
  if (m) return `${m[1]}레벨 리롤`
  const f = s.match(/fast (\d+)/i)
  return f ? `빠른 ${f[1]}` : s
}

function isEmblem(item) {
  const api = item?.apiName || ""
  return (item?.tags || []).includes("Emblem") || api.includes("Emblem") ||
    (item?.composition || []).some((c) => c === "TFT_Item_Spatula" || c === "TFT_Item_FryingPan")
}

function buildComps(raw, stats, lk) {
  const unitByAsset = {}
  for (const u of lk.units) for (const a of u.assetNames || []) unitByAsset[a] = u
  for (const [asset, api] of Object.entries(lk.unitAssetNames || {})) {
    if (!unitByAsset[asset]) unitByAsset[asset] = lk.units.find((u) => u.apiName === api)
  }
  const nameOf = {}
  for (const t of lk.traits) nameOf[t.apiName] = t.name
  for (const i of lk.items) nameOf[i.apiName] = i.name
  const unitName = (a) => unitByAsset[a]?.name || a.replace(/^DA_(18_)?|18$/g, "")
  const unitIcon = (a) => ICON("champions", unitByAsset[a]?.apiName || a)
  const itemName = (a) => nameOf[a] || a.replace(/^DA_(18_)?/, "")

  const details = raw.results.data.cluster_details
  const itemByApi = {}
  for (const i of lk.items) itemByApi[i.apiName] = i
  const total = stats.results.find((r) => r.cluster === "").places[0]

  // Placement histogram -> avg, then the site's default hiding rules: low pick
  // rate, augment-gated or emblem-gated comps, and weak clusters.
  return stats.results
    .filter((r) => r.cluster !== "" && r.cluster !== "-1" && details[r.cluster])
    .map((r) => {
      const places = r.places.slice(0, 8)
      const count = places.reduce((a, b) => a + b, 0)
      const avg = places.reduce((a, n, k) => a + (k + 1) * n, 0) / count
      return { c: details[r.cluster], avg, pick: count / total * 8 }
    })
    .filter(({ c, pick }) =>
      pick >= MIN_PICK_RATE &&
      !c.name_string.includes("Augment") &&
      !(c.top_itemNames || []).some((t) => t.pcnt >= 0.5 && isEmblem(itemByApi[t.itemNames])) &&
      Math.max(...c.centroid) >= 1)
    .sort((a, b) => a.avg - b.avg)
    .map(({ c, avg, pick }) => {
      // `stars` lists units commonly 3-starred in this cluster; it can name
      // units outside the final board, so only mark the ones on it.
      const stars = new Set(c.stars || [])
      const units = c.units_string.split(", ").map((a) => ({
        name: unitName(a),
        cost: unitByAsset[a]?.cost || 1,
        icon: unitIcon(a),
        three: stars.has(a),
      })).sort((a, b) => a.cost - b.cost)

      const traitCount = {}
      for (const a of c.units_string.split(", ")) {
        for (const t of unitByAsset[a]?.traits || []) traitCount[t] = (traitCount[t] || 0) + 1
      }
      const traits = Object.entries(traitCount)
        .filter(([, n]) => n >= 2)
        .sort((a, b) => b[1] - a[1])
        .map(([t, n]) => `${t} ${n}`)

      // Best-scoring 3-item build for each unit that has one, top 3 carries.
      const best = {}
      for (const b of c.builds || []) {
        if (b.num_items !== 3) continue
        if (!best[b.unit] || b.count > best[b.unit].count) best[b.unit] = b
      }
      const carries = Object.values(best)
        .sort((a, b) => b.count - a.count)
        .slice(0, 3)
        .map((b) => ({
          name: unitName(b.unit),
          icon: unitIcon(b.unit),
          cost: unitByAsset[b.unit]?.cost || 1,
          three: stars.has(b.unit),
          items: b.buildName.map((i) => ({ name: itemName(i), icon: ICON("items", i) })),
        }))

      const title = c.name.map((n) => (n.type === "unit" ? unitName(n.name) : nameOf[n.name] || n.name)).join(" ")
      return {
        title,
        avg,
        pick,
        tier: tierOf(avg),
        level: levelText(c.levelling),
        units, traits, carries,
      }
    })
}

function drawIcon(url, label, x, y, size, border) {
  ctx.fillStyle = border
  ctx.fillRect(x - 3, y - 3, size + 6, size + 6)
  const img = imageOf(url)
  if (img) {
    ctx.drawImage(img, x, y, size, size)
  } else {
    ctx.fillStyle = "#222"
    ctx.fillRect(x, y, size, size)
    ctx.fillStyle = "#fff"
    ctx.font = "bold 16px -apple-system, sans-serif"
    ctx.textAlign = "center"
    ctx.fillText(label.slice(0, 4), x + size / 2, y + size / 2 - 8, size - 4)
    ctx.textAlign = "left"
  }
}

function drawUnit(u, x, y, size) {
  drawIcon(u.icon, u.name, x, y, size, COST_COLORS[u.cost] || "#666")
  if (!u.three) return
  ctx.font = `bold ${Math.round(size * 0.3)}px -apple-system, sans-serif`
  ctx.textAlign = "center"
  ctx.lineWidth = 4
  ctx.strokeStyle = "#000"
  ctx.strokeText("★★★", x + size / 2, y - size * 0.32)
  ctx.fillStyle = "#ffd700"
  ctx.fillText("★★★", x + size / 2, y - size * 0.32)
  ctx.textAlign = "left"
}

function draw(i = idx) {
  ctx.fillStyle = "#0b0b0f"
  ctx.fillRect(0, 0, W, H)
  ctx.textBaseline = "top"
  ctx.textAlign = "left"
  const c = comps[i]
  if (!c) {
    ctx.fillStyle = "#fff"
    ctx.font = "40px -apple-system, sans-serif"
    ctx.fillText("불러오는 중...", 40, 40)
    return
  }

  // Header: tier badge, rank, title
  ctx.fillStyle = TIER_COLORS[c.tier]
  ctx.fillRect(30, 28, 64, 64)
  ctx.fillStyle = "#000"
  ctx.font = "bold 46px -apple-system, sans-serif"
  ctx.textAlign = "center"
  ctx.fillText(c.tier, 62, 36)
  ctx.textAlign = "left"
  ctx.fillStyle = "#fff"
  ctx.font = "bold 46px -apple-system, sans-serif"
  ctx.fillText(`${i + 1}. ${c.title}`, 112, 32, W - 140)
  ctx.fillStyle = "#aaa"
  ctx.font = "26px -apple-system, sans-serif"
  ctx.fillText(`평균 ${c.avg.toFixed(2)}등 · ${c.level}`, 112, 86)

  // Units as cost-bordered portraits, gold stars on the ones to 3-star
  const n = c.units.length
  const size = Math.min(100, Math.floor((W - 60 - (n - 1) * 8) / n))
  let x = 30
  for (const u of c.units) {
    drawUnit(u, x, 156, size)
    x += size + 8
  }

  // Carries: portrait plus their three items
  const colW = (W - 60) / 3
  c.carries.forEach((k, j) => {
    const cx = 30 + j * colW
    drawUnit(k, cx, 330, 84)
    k.items.forEach((it, m) => drawIcon(it.icon, it.name, cx + 94 + m * 66, 342, 60, "#444"))
  })

  // Traits
  ctx.fillStyle = "#8ab4ff"
  ctx.font = "24px -apple-system, sans-serif"
  ctx.fillText(c.traits.join("  "), 30, H - 50, W - 60)
  ctx.fillStyle = "#555"
  ctx.textAlign = "right"
  ctx.fillText(`${i + 1}/${comps.length}`, W - 30, H - 50)
}

function renderList() {
  listEl.innerHTML = ""
  comps.forEach((c, i) => {
    const el = document.createElement("div")
    el.className = "comp" + (i === idx ? " sel" : "")
    el.innerHTML = `<span class="tier" style="background:${TIER_COLORS[c.tier]}">${c.tier}</span>
      <span class="name">${c.title}</span><span class="avg">${c.avg.toFixed(2)}</span>`
    el.onclick = () => select(i)
    listEl.appendChild(el)
  })
}

// Each comp becomes a SEG-second still segment of a real MP4, so the PiP
// skip ±10s buttons land exactly on the previous/next comp.
const SEG = 10
let fileMode = false

function select(i) {
  if (!comps.length) return
  idx = Math.min(Math.max(i, 0), comps.length - 1)
  if (fileMode) seekTo(idx * SEG + 0.5)
  else draw()
  renderList()
}

// Seeks we issue ourselves (paging, looping) must not be mistaken for the
// PiP skip buttons.
let selfSeek = false
function seekTo(t) {
  selfSeek = true
  video.currentTime = t
}

// The video keeps playing so PiP always repaints (a paused PiP ignores seeks
// visually); playback is held inside the current comp's segment instead.
video.addEventListener("seeking", () => {
  if (!fileMode || !comps.length) return
  if (selfSeek) return
  const i = Math.min(Math.max(Math.floor(video.currentTime / SEG), 0), comps.length - 1)
  log(`skip → ${video.currentTime.toFixed(1)}s (덱 ${i + 1})`)
  if (i !== idx) { idx = i; renderList() }
})
video.addEventListener("seeked", () => { selfSeek = false })
video.addEventListener("timeupdate", () => {
  if (!fileMode || video.seeking) return
  if (video.currentTime >= idx * SEG + SEG - 1.5 || video.currentTime < idx * SEG) seekTo(idx * SEG + 0.5)
})
video.addEventListener("ended", () => { seekTo(idx * SEG + 0.5); video.play().catch(() => {}) })

async function buildVideo() {
  if (!("VideoEncoder" in window)) throw new Error("VideoEncoder 미지원")
  const { Muxer, ArrayBufferTarget } = await import(MUXER_URL)
  const config = { codec: "avc1.42001f", width: W, height: H, bitrate: 500_000, framerate: 1 }
  if (!(await VideoEncoder.isConfigSupported(config)).supported) throw new Error("H.264 인코딩 미지원")
  const target = new ArrayBufferTarget()
  const muxer = new Muxer({ target, video: { codec: "avc", width: W, height: H }, fastStart: "in-memory" })
  let encError = null
  const enc = new VideoEncoder({
    output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
    error: (e) => { encError = e },
  })
  enc.configure(config)
  for (let i = 0; i < comps.length; i++) {
    draw(i)
    // Constant 1 fps, every frame a keyframe, so any seek lands on a complete
    // image of the right comp.
    for (let sec = 0; sec < SEG; sec++) {
      const f = new VideoFrame(canvas, { timestamp: (i * SEG + sec) * 1e6, duration: 1e6 })
      enc.encode(f, { keyFrame: true })
      f.close()
    }
  }
  await enc.flush()
  if (encError) throw encError
  muxer.finalize()
  return URL.createObjectURL(new Blob([target.buffer], { type: "video/mp4" }))
}

document.getElementById("prev").onclick = () => select(idx - 1)
document.getElementById("next").onclick = () => select(idx + 1)

let autoTimer = null
document.getElementById("auto").onchange = (e) => {
  clearInterval(autoTimer)
  const sec = Number(e.target.value)
  if (sec) autoTimer = setInterval(() => select(idx + 1 < comps.length ? idx + 1 : 0), sec * 1000)
}

// Live-stream fallback until (or unless) the MP4 is ready.
draw()
let streamTimer = setInterval(() => { if (!fileMode) draw() }, 500)
video.srcObject = canvas.captureStream(10)
video.play().catch(() => {})

// PiP must be requested synchronously inside the tap handler, while playing.
video.addEventListener("webkitpresentationmodechanged", () => log("모드: " + video.webkitPresentationMode))

document.getElementById("pip").onclick = () => {
  log("PiP 버튼 눌림 (" + (fileMode ? "영상" : "스트림") + " 모드)")
  video.play().catch((e) => log("play 실패: " + e.message))
  try {
    if (video.webkitSupportsPresentationMode && video.webkitSupportsPresentationMode("picture-in-picture")) {
      video.webkitSetPresentationMode("picture-in-picture")
    } else if (document.pictureInPictureEnabled) {
      video.requestPictureInPicture().catch((e) => log("실패: " + e.message))
    } else {
      log("PiP 미지원")
    }
  } catch (e) {
    log("실패: " + e.message)
  }
}

// Comps are fetched on load; a page left open reloads once a day, but never
// while PiP is up since a reload would close it.
const REFRESH_MS = 24 * 60 * 60 * 1000
const loadedAt = Date.now()
function refreshIfStale() {
  if (Date.now() - loadedAt < REFRESH_MS) return
  if (video.webkitPresentationMode === "picture-in-picture" || document.pictureInPictureElement) return
  location.reload()
}
setInterval(refreshIfStale, 10 * 60 * 1000)
document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshIfStale() })

;(async () => {
  try {
    const raw = await (await fetch(COMPS_URL, { cache: "no-store" })).json()
    const set = raw.results.data.tft_set || raw.tft_set
    const [lk, stats] = await Promise.all([
      fetch(LOOKUP_URL(set)).then((r) => r.json()),
      fetch(STATS_URL(raw.cluster_id), { cache: "no-store" }).then((r) => r.json()),
    ])
    comps = buildComps(raw, stats, lk)
    log(`${set} · 덱 ${comps.length}개 · 갱신 ${new Date(stats.updated).toLocaleString("ko-KR")}`)
    document.getElementById("updated").textContent =
      `MetaTFT 데이터 ${new Date(stats.updated).toLocaleString("ko-KR")} · 하루마다 자동 새로고침`
    renderList()
    const urls = new Set(comps.flatMap((c) => [
      ...c.units.map((u) => u.icon),
      ...c.carries.flatMap((k) => [k.icon, ...k.items.map((it) => it.icon)]),
    ]))
    const loaded = await Promise.all([...urls].map(loadImage))
    log(`아이콘 ${loaded.filter(Boolean).length}/${urls.size}개`)
    draw()
    try {
      const t0 = Date.now()
      const url = await buildVideo()
      log(`영상 생성 ${((Date.now() - t0) / 1000).toFixed(1)}초`)
      clearInterval(streamTimer)
      video.srcObject = null
      video.src = url
      fileMode = true
      video.addEventListener("loadedmetadata", () => { select(idx); video.play().catch(() => {}) }, { once: true })
      log("영상 모드: PiP ±10초 버튼으로 덱 이동")
    } catch (e) {
      log("영상 생성 실패, 스트림 모드 사용: " + e.message)
      select(0)
    }
  } catch (e) {
    listEl.textContent = "불러오기 실패: " + e.message
  }
})()
</script>
</body>
</html>
